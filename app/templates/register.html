<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Accessible Learning</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 460px;
        }

        .register-card {
            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 20px 45px rgba(0, 0, 0, 0.18);
        }

        .logo {
            text-align: center;

            font-size: 30px;

            margin-bottom: 8px;

            color: #1d4ed8;
        }

        .subtitle {
            text-align: center;

            color: #6b7280;

            margin-bottom: 25px;
        }

        .register-card h2 {
            text-align: center;

            color: #111827;

            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #374151;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            font-size: 16px;

            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .register-button {
            width: 100%;

            border: none;

            background: #2563eb;

            color: white;

            padding: 14px;

            border-radius: 10px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .register-button:hover {
            background: #1d4ed8;
        }

        .login-link {
            text-align: center;

            margin-top: 25px;

            color: #4b5563;
        }

        .login-link a {
            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #6b7280;

            text-decoration: none;
        }

        .back-home:hover {
            color: #111827;
        }

        .accessibility-note {
            margin-top: 25px;

            padding: 15px;

            background: #eff6ff;

            border-radius: 10px;

            color: #374151;

            font-size: 14px;

            text-align: center;
        }

        @media (max-width: 500px) {
            .register-card {
                padding: 28px 22px;
            }

            .logo {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="register-card">

            <div class="logo">
                ♿ Accessible Learning
            </div>

            <p class="subtitle">
                Learn Without Limits
            </p>

            <h2>
                Create Account
            </h2>

            <!-- Connected to Flask registration route -->
            <form action="{{ url_for('register') }}" method="POST">

                <div class="form-group">
                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required
                    >
                </div>


                <button
                    type="submit"
                    class="register-button"
                >
                    Create Account
                </button>

            </form>


            <div class="login-link">

                <p>
                    Already have an account?

                    <a href="{{ url_for('login') }}">
                        Login
                    </a>
                </p>

            </div>


            <a
                href="{{ url_for('home') }}"
                class="back-home"
            >
                ← Back to Home
            </a>


            <div class="accessibility-note">
                This platform is designed to support
                accessible and inclusive learning.
            </div>

        </div>

    </div>

</body>
</html>
